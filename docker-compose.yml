# Production-style: app (standalone) + PostgreSQL
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: reactauth
      POSTGRES_PASSWORD: reactauth
      POSTGRES_DB: reactauth
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reactauth -d reactauth"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    healthcheck:
      # Node 22 내장 fetch — 앱이 응답하지 않으면 unhealthy → restart 정책이 복구
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    environment:
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: reactauth
      DB_PASSWORD: reactauth
      DB_NAME: reactauth
      UPLOAD_ROOT: /app/uploads
      # 기본값을 두지 않는다 — 미설정이면 `docker compose up`이 기동 전에 실패한다.
      # 생성: openssl rand -base64 48
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?호스트 .env 에 설정하세요}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?호스트 .env 에 설정하세요}
      # 위젯·AI 어시스턴트용 API 키 — 이미지에 .env를 넣지 않으므로 호스트 .env에서 주입
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      PEXELS_API_KEY: ${PEXELS_API_KEY:-}
      OPENWEATHERMAP_API_KEY: ${OPENWEATHERMAP_API_KEY:-}
      NEWSAPI_KEY: ${NEWSAPI_KEY:-}
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: {}
  uploads: {}
