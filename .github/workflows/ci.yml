name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Docker 런타임(node:22-alpine)과 동일 메이저로 검증
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      # 프로덕션 번들이 실제로 빌드되는지 — 라우트/설정 결함을 배포 전에 검출
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
